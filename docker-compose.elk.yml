
networks:
  obs-net:
    external: true
    name: obs-lab_obs-net   # Docker auto-prefixes with project folder name

volumes:
  elasticsearch_data: {}

services:

  # ----------------------------------------------------------
  #  ELASTICSEARCH  — log storage + search engine
  #  UI: http://localhost:9200  (elastic / elastic123)
  # ----------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    restart: unless-stopped
    networks: [obs-net]
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - node.name=elasticsearch
      - cluster.name=obs-lab-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=elastic123
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2048m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:elastic123 http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ----------------------------------------------------------
  #  KIBANA  — log explorer + dashboards
  #  UI: http://localhost:5601  (elastic / elastic123)
  # ----------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    restart: unless-stopped
    networks: [obs-net]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=elastic123
      - KIBANA_SYSTEM_PASSWORD=elastic123
      - xpack.security.enabled=true
      - SERVER_NAME=kibana
    mem_limit: 1024m
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ----------------------------------------------------------
  #  FILEBEAT  — ships container + system logs to Elasticsearch
  # ----------------------------------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    restart: unless-stopped
    networks: [obs-net]
    user: root
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    mem_limit: 128m
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ----------------------------------------------------------
  #  LOGSTASH  — log parsing + enrichment pipeline
  #  Ports: 5044 (beats), 5001 (TCP input), 9600 (API)
  # ----------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    restart: unless-stopped
    networks: [obs-net]
    ports:
      - "5044:5044"
      - "5001:5000"
      - "9600:9600"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    mem_limit: 512m
    depends_on:
      elasticsearch:
        condition: service_healthy
