
groups:

  - name: host_alerts
    rules:
      - alert: HostHighCpuLoad
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU {{ $value | printf \"%.1f\" }}%"

      - alert: HostOutOfMemory
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low memory on {{ $labels.instance }}"

      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|aufs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|aufs"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low: {{ $labels.mountpoint }}"

  - name: app_alerts
    rules:
      - alert: AppHighErrorRate
        expr: |
          sum by(service) (rate(http_requests_total{status=~"5.."}[5m]))
          / sum by(service) (rate(http_requests_total[5m])) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate {{ $value | printf \"%.1f\" }}%"

      - alert: AppHighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum by(service, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency high on {{ $labels.service }}"

      - alert: AppDown
        expr: up{job="demo-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Demo app is DOWN"

  - name: blackbox_alerts
    rules:
      - alert: EndpointDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint DOWN: {{ $labels.instance }}"

      - alert: EndpointSlowResponse
        expr: probe_duration_seconds > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response: {{ $labels.instance }}"
